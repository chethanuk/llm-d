# Shared delta over the tiered-prefix-cache native overlays: Qwen3.8-27B-FP8,
# one GPU per pod (TP=1), guide labels, and the vLLM image pin.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

labels:
  - pairs:
      llm-d.ai/model: Qwen3.8-27B-FP8
      llm-d.ai/guide: qwen3-8-27b
    includeSelectors: true
    includeTemplates: true

# TODO(#issue): drop once gpu-vllm/release >= v0.32.0; cu129 for pre-r580 drivers
images:
  - name: docker.io/vllm/vllm-openai
    newName: docker.io/vllm/vllm-openai
    newTag: v0.32.0-cu129

patches:
  - path: patch-vllm.yaml
